<!--
    Hạch toán tài chính
    Bản gốc: ApisTaiChinh/Modules/thongke/html/hachtoantaichinh.html + scripts/hachtoantaichinh.js
    Hạch toán cân đối các khoản CHUNG và RIÊNG: dư thừa / dư thiếu, chi tiết
    theo khoản hoặc theo đối tượng.
-->
<link rel="stylesheet" href="../css/hachtoantaichinh.css">

<div id="hachtoantaichinh">
    <div class="ums-page__head">
        <h1 class="ums-page__title ums-u-mb-0">Hạch toán tài chính</h1>
        <!-- Bản gốc có dòng "Thời gian: 27/07/2018 - 20/08/2018" viết cứng kèm
             một nút tìm không gắn xử lý. Ở đây là thời điểm số liệu được nạp
             (có thật) và nút Tải lại chạy được. -->
        <span class="ums-page__when"><i class="fa-light fa-clock"></i> Số liệu tính đến
            <b data-z="tinhDen">—</b></span>
        <div class="ums-page__actions">
            <button type="button" class="ums-btn ums-btn--out-primary" data-act="reload">
                <i class="fa-light fa-rotate-right"></i><span>Tải lại</span></button>
        </div>
    </div>

    <div class="ums-grid ums-grid--2" style="align-items:start" data-z="list">
        <div class="ums-panel tk-grp tk-grp--chung">
            <div class="ums-panel__head">
                <div class="ums-panel__title"><i class="fa-light fa-calculator"></i> Hạch toán cân đối các khoản CHUNG</div>
            </div>
            <div class="ums-panel__body ums-stack" data-z="chung"></div>
        </div>
        <div class="ums-panel tk-grp tk-grp--rieng" style="margin-top:0">
            <div class="ums-panel__head">
                <div class="ums-panel__title"><i class="fa-light fa-calculator"></i> Hạch toán cân đối các khoản RIÊNG</div>
            </div>
            <div class="ums-panel__body ums-stack" data-z="rieng"></div>
        </div>
    </div>

    <div class="ums-panel" data-z="detail" hidden>
        <div class="ums-panel__head">
            <div class="ums-panel__title"><i class="fa-light fa-circle-info"></i> <span data-z="detailTitle">Thông tin chi tiết</span></div>
            <div class="ums-panel__tools"><button type="button" class="ums-btn ums-btn--ghost" data-act="back"><i class="fa-light fa-xmark"></i><span>Đóng</span></button></div>
        </div>
        <div class="ums-panel__body ums-panel__body--flush" data-z="detailTable"></div>
    </div>
</div>

<script src="../scripts/_chung.js"></script>
<script src="../scripts/hachtoantaichinh.js"></script>
