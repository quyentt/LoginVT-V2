<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Giả lập trang vấn đề nhúng của Help</title>
<!-- Trang THỬ cho chế độ nhúng (tài liệu mục 11, Help 11.7): plugin nạp trang này vào iframe khi chạy dữ liệu dựng thử
     (index.html, không có phiên). Giả lập đúng bộ sự kiện postMessage 11.3 chiều Help → app và nhận app-token / app-dong
     chiều app → Help. Trên host thật iframe nhận trang /ho-tro/nhung/<id> của Help, không dùng tệp này. -->
<style>
  body { margin: 0; font: 13px/1.45 Arial, Helvetica, sans-serif; color: #131a27; background: #fff; display: flex; flex-direction: column; height: 100vh; }
  .d { padding: 8px 12px; background: #fff7ed; color: #9a3412; border-bottom: 1px solid #fed7aa; font-size: 12px; }
  .c { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .m { max-width: 70%; padding: 8px 10px; border-radius: 10px; background: #f1f3f8; }
  .m.t { align-self: flex-end; background: #e8f0ff; }
  .m small { display: block; color: #6e7a90; font-size: 11px; margin-top: 3px; }
  .g { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid #d8dee9; }
  .g input { flex: 1; height: 32px; padding: 0 10px; border: 1px solid #d8dee9; border-radius: 6px; font: inherit; }
  .g button, .b button { height: 32px; padding: 0 12px; border: 1px solid #d8dee9; border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
  .b { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; background: #f8fafc; border-top: 1px solid #d8dee9; font-size: 12px; }
  .b span { align-self: center; color: #6e7a90; }
  #log { font: 11px/1.4 ui-monospace, Consolas, monospace; color: #6e7a90; padding: 6px 12px; white-space: pre-wrap; max-height: 90px; overflow: auto; border-top: 1px dashed #d8dee9; }
</style>
</head>
<body>
<div class="d">Giả lập trang vấn đề nhúng của Help — <b id="ma"></b>. Trên host thật đây là <code>/ho-tro/nhung/&lt;id&gt;</code> do Help trả.</div>
<div class="c" id="chat"></div>
<div class="g"><input id="o" placeholder="Nhập tin nhắn (giả lập)…" maxlength="500"><button type="button" id="gui">Gửi</button></div>
<div class="b"><span>Giả lập Help bắn sự kiện:</span>
  <button type="button" data-ev="trangthai">Trạng thái → Đang xử lý</button>
  <button type="button" data-ev="tinmoi">Tin mới (+1)</button>
  <button type="button" data-ev="dadoc">Đã đọc (0)</button>
  <button type="button" data-ev="phienhet">Phiên hết</button>
  <button type="button" data-ev="loi">Báo lỗi</button>
</div>
<div id="log"></div>
<script>
(function () {
    var q = {}; location.search.replace(/^\?/, '').split('&').forEach(function (p) { var k = p.split('='); if (k[0]) q[decodeURIComponent(k[0])] = decodeURIComponent(k[1] || ''); });
    var id = q.id || 'mau', ma = q.ma || id, chat = document.getElementById('chat'), log = document.getElementById('log');
    var dich = (function () { try { return new URL(document.referrer).origin; } catch (e) { return location.origin; } })();   // Help thật: origin trường theo sổ, không "*"
    document.getElementById('ma').textContent = ma;
    function ghi(s) { log.textContent += s + '\n'; log.scrollTop = log.scrollHeight; }
    function tin(noiDung, cuaToi, ai) { var m = document.createElement('div'); m.className = 'm' + (cuaToi ? ' t' : ''); m.innerHTML = noiDung.replace(/</g, '&lt;') + '<small>' + (ai || (cuaToi ? 'Bạn' : 'Hỗ trợ')) + ' · vừa xong</small>'; chat.appendChild(m); chat.scrollTop = chat.scrollHeight; }
    function gui(d) { d.id = id; parent.postMessage(d, dich); ghi('→ app ' + JSON.stringify(d)); }
    if (q.moi) tin('Đã nhận yêu cầu ' + ma + '. Bộ phận hỗ trợ sẽ phản hồi sớm.', false, 'Help');
    else { tin('Tôi gặp lỗi ở màn này, nhờ hỗ trợ kiểm tra giúp.', true); tin('Đã nhận, chúng tôi đang xem. Bạn gửi thêm ảnh chỗ lỗi được không?', false); }
    setTimeout(function () { gui({ loai: 'help-san-sang' }); }, 400);
    document.getElementById('gui').onclick = function () { var o = document.getElementById('o'); if (!o.value.trim()) return; tin(o.value, true); o.value = ''; };
    document.getElementById('o').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('gui').click(); });
    var soMoi = 0;
    document.querySelector('.b').addEventListener('click', function (e) {
        var b = e.target.closest('[data-ev]'); if (!b) return;
        var k = b.getAttribute('data-ev');
        if (k === 'trangthai') gui({ loai: 'help-trang-thai', trangThai: 'DANG_XU_LY', ten: 'Đang xử lý', mau: '#d97706' });
        else if (k === 'tinmoi') { tin('Phản hồi mới số ' + (++soMoi) + ' từ hỗ trợ.', false); gui({ loai: 'help-tin-moi', soChuaDoc: soMoi }); }
        else if (k === 'dadoc') { soMoi = 0; gui({ loai: 'help-tin-moi', soChuaDoc: 0 }); }
        else if (k === 'phienhet') gui({ loai: 'help-phien-het' });
        else if (k === 'loi') gui({ loai: 'help-loi', loi: 'THU', thongBao: 'Lỗi giả lập từ trang nhúng' });
    });
    window.addEventListener('message', function (ev) {
        if (ev.origin !== dich) return;
        var d = ev.data || {};
        if (d.loai === 'app-token') ghi('← app app-token ' + String(d.token).slice(0, 24) + '… (đổi access token tại chỗ, giữ nháp)');
        else if (d.loai === 'app-dong') ghi('← app app-dong (lưu nháp)');
    });
})();
</script>
</body>
</html>
