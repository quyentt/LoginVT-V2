<!--
    Dashboard (Ký túc xá) — menu host: "Dashboard"
    Bản gốc: ApisKyTucXa/Modules/dashboard/html/dashboard.html (28 dòng: hai <div class="row"> trống)
             + script/dashboard.js (74 dòng, bản nháp 08/01/2019)
    Bản gốc KHÔNG hiện gì: dashboard.js vẽ sơ đồ 5 tầng × 12 phòng bằng số cứng (không gọi API) vào
    #building_type1..3, nhưng ba id đó không có trong HTML → trang trống. Giữ một trang trống có ghi chú,
    không gọi gì; sơ đồ phòng thật nằm ở màn "Tòa nhà - số phòng" (cosovatchat/toanha).
    Cố ý bỏ: building_Type1 / building_Type2 (dữ liệu cứng, mã chết).
-->
<div id="ktx-dashboard"></div>
<script>
(function () {
    var root = document.getElementById('ktx-dashboard');
    if (!root) return;
    root.innerHTML = ums.pat.page('Dashboard', '') + ums.pat.panel({
        title: false,
        body: ums.ui.empty('Bản gốc của màn này chưa có nội dung (dashboard.js chỉ là bản nháp vẽ sơ đồ phòng bằng số cứng vào vùng không có trong trang). Sơ đồ phòng thật: Cơ sở vật chất → Tòa nhà - số phòng.', 'fa-gauge')
    });
})();
</script>
