<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <base href="/">
    <title>Đo giao diện đang chạy</title>

    <!-- Nạp đúng bộ CSS mà indexi.aspx đang dùng -->
    <link href="App_Themes/Plugins/font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <link href="App_Themes/Plugins/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="App_Themes/Plugins/ionicons/css/ionicons.min.css" rel="stylesheet">
    <link href="App_Themes/Cms/adminlte/css/AdminLTE.min.css" rel="stylesheet">
    <link href="App_Themes/Cms/adminlte/css/_all-skins.min.css" rel="stylesheet">
    <link href="App_Themes/Plugins/select2/css/select2.min.css" rel="stylesheet">
    <link href="App_Themes/Plugins/pagination/simplePagination.min.css" rel="stylesheet">
    <link href="App_Themes/Plugins/datepicker/datepicker3.min.css" rel="stylesheet">
    <link href="App_Themes/Cms/css/index.css" rel="stylesheet">
    <link href="App_Themes/Cms/css/index.min.css" rel="stylesheet">
    <link href="App_Themes/Cms/Custom_V1/styles.css" rel="stylesheet">

    <style>
        #out { font: 12px/1.5 Consolas, monospace; white-space: pre; padding: 12px; background: #111; color: #ddd; }
    </style>
</head>

<body class="hold-transition skin-blue">

    <!-- Vùng dựng lại markup thật để đo -->
    <section id="probe" style="padding:20px">
        <div class="box box-solid">
            <div class="box-header with-border">
                <h3 class="box-title"><i class="fa fa-list-ul"></i> Tiêu đề box</h3>
                <div class="box-tools pull-right">
                    <button class="btn btn-default">Nút mặc định</button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-3 item-search">
                        <div class="title-name">Nhãn</div>
                        <select class="form-control select-opt"><option>Chọn</option></select>
                    </div>
                    <div class="col-sm-3 item-search">
                        <input type="text" class="form-control" placeholder="Nhập">
                    </div>
                </div>

                <div class="aps-form-item">
                    <div class="col-sm-3 aps-lable-name title-name">Mã kế hoạch</div>
                    <div class="col-sm-9 aps-form-input"><input class="form-control" value="KH-BHYT"></div>
                </div>

                <table class="table table-hover table-bordered" id="t1">
                    <thead>
                        <tr>
                            <th class="td-center">Stt</th>
                            <th>Tên kế hoạch</th>
                            <th class="td-center">Tình trạng</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="r1">
                            <td class="td-center">1</td>
                            <td class="td-left">Kế hoạch mua BHYT</td>
                            <td class="td-center">
                                <a class="btn btn-default btnEdit"><i class="fa fa-pencil"></i></a>
                                <a class="btn btn-default btn-circle btnDelete"><i class="fa fa-trash"></i></a>
                            </td>
                        </tr>
                        <tr id="r2">
                            <td class="td-center">2</td>
                            <td class="td-left">Đồng phục khoá 19</td>
                            <td class="td-center">—</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <pre id="out">đang đo…</pre>

    <script>
        (function () {
            var PROPS = [
                'font-family', 'font-size', 'font-weight', 'line-height', 'color',
                'background-color', 'background-image',
                'border-top-width', 'border-top-style', 'border-top-color',
                'border-bottom-width', 'border-bottom-color',
                'border-top-left-radius',
                'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
                'margin-bottom', 'height', 'min-height', 'box-shadow', 'text-transform'
            ];

            var TARGETS = [
                ['body', 'body'],
                ['.box', '.box'],
                ['.box-header', '.box-header'],
                ['.box-title', '.box-title'],
                ['.box-body', '.box-body'],
                ['th', '#t1 thead th'],
                ['th (center)', '#t1 thead th.td-center'],
                ['td', '#t1 #r1 td'],
                ['tr:hover', '#t1 #r1'],
                ['table', '#t1'],
                ['.btn-default', '.box-tools .btn-default'],
                ['.btn trong bang', '#r1 .btnEdit'],
                ['.form-control', '.aps-form-input .form-control'],
                ['select.form-control', 'select.form-control'],
                ['.title-name', '.item-search .title-name'],
                ['.aps-lable-name', '.aps-lable-name'],
                ['.item-search', '.item-search']
            ];

            function m(sel) {
                var el = document.querySelector(sel);
                if (!el) return null;
                var cs = getComputedStyle(el);
                var o = {};
                PROPS.forEach(function (p) {
                    var v = cs.getPropertyValue(p);
                    if (v && v !== 'none' && v !== 'normal' && v !== '0px' && v !== 'rgba(0, 0, 0, 0)') o[p] = v.trim();
                });
                var r = el.getBoundingClientRect();
                o['__w'] = Math.round(r.width) + 'px';
                o['__h'] = Math.round(r.height) + 'px';
                return o;
            }

            var lines = [];
            TARGETS.forEach(function (t) {
                var o = m(t[1]);
                lines.push('=== ' + t[0] + '   (' + t[1] + ')');
                if (!o) { lines.push('   KHONG TIM THAY'); return; }
                Object.keys(o).forEach(function (k) { lines.push('   ' + k + ': ' + o[k]); });
            });

            document.getElementById('out').textContent = lines.join('\n');
        })();
    </script>
</body>

</html>
