<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>kiểm cột trái</title></head>
<body>
<pre id="out"></pre>
<iframe id="f" src="../_v2/index.html" style="width:1440px;height:900px"></iframe>
<script>
/* Kiểm CỘT TRÁI (danh sách + ô tìm) theo _v2/BO-CUC.md luật 12 (người dùng 2026-09-26):
     1. nút trên tiêu đề cột là Tải lại (fa-rotate-right) — KHÔNG kính lúp
     2. gõ từ khoá là TỰ TÌM (không cần Enter) — gõ chuỗi vô nghĩa, đợi 900ms, danh sách phải đổi
        (hoặc có lời gọi API mới)
     3. KHÔNG có nút "Tìm kiếm" trong cột (đổi ô chọn là tự tải)
     4. ô chọn lọc nằm trong khung "Bộ lọc nâng cao" (.ums-master__adv, mở bằng nút fa-sliders) — không hiện sẵn
     5. mục danh sách KHÔNG có nút sửa / xoá / xem riêng — thao tác nằm trên tiêu đề khung bên phải
   Tham số như kiem-dong-bo.html: ?vt=R33&tien=TC  ?s=<module-tep,...>  (màn chưa chuyển tự bỏ qua).
   Mỗi dòng "!!" là một chỗ phải sửa; "ok" = màn có cột trái đạt; màn không có cột trái có ô tìm thì không in. */
var out = [];
function log(s) { out.push(s); document.getElementById('out').textContent = out.join('\n'); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var QS = new URLSearchParams(location.search);
var ONLY = (QS.get('s') || '').split(',').filter(Boolean);
var VT = QS.get('vt') || 'R33', TIEN = QS.get('tien') || 'TC';
function ganTV(ss) { if (VT === 'R04') ss.setItem('ums.thuvai', JSON.stringify({ roleId: 'R04', userIdGoc: 'CANBO01', userIdVai: 'SV0001', info: { ten: 'Lăng Văn Huy - DCOT.16.2', ma: '25001029', email: '', tenVaiTro: 'Cổng sinh viên - thủ vai' } })); }
ganTV(sessionStorage);

function an(el) { return !el || !!el.closest('[hidden]') || el.offsetParent === null && !el.classList.contains('select2-hidden-accessible'); }

document.getElementById('f').onload = async function () {
    var w = this.contentWindow;
    await wait(600);
    var nguon = (w.ums.demo.menus && w.ums.demo.menus[VT]) || w.ums.demo.menu;
    var menu = nguon.filter(function (m) { return m.ID.indexOf(TIEN + '-') === 0; });
    if (ONLY.length) menu = menu.filter(function (m) { return ONLY.indexOf(m.ID.replace(TIEN + '-', '')) >= 0; });
    var bad = 0, co = 0;

    for (var i = 0; i < menu.length; i++) {
        ganTV(w.sessionStorage);
        w.location.hash = '#/r/' + VT + '/' + menu[i].ID;
        await wait(1800);
        var d = w.document, sc = d.getElementById('screen');
        if (!sc || /chưa chuyển sang giao diện mới/.test(sc.textContent)) continue;
        /* đếm lời gọi API (bọc một lần) */
        if (w.ums.api && !w.ums.api.call.__dem) {
            var goc = w.ums.api.call, bocd = function () { bocd.n++; return goc.apply(this, arguments); };
            bocd.n = 0; bocd.__dem = true; w.ums.api.call = bocd;
        }
        var sides = Array.prototype.slice.call(sc.querySelectorAll('.ums-master__side')).filter(function (s) { return !an(s); });
        var loi = [], coCot = false;
        for (var k = 0; k < sides.length; k++) {
            var side = sides[k];
            /* ô tìm: ô chuẩn .ums-master__search, hoặc ô chữ tự dựng có chữ gợi ý tìm kiếm / từ khoá */
            var inp = Array.prototype.slice.call(side.querySelectorAll('.ums-master__search input, .ums-searchbar__input, .ums-panel__body input[type=text], .ums-panel__body input:not([type])'))
                .filter(function (x) { return !an(x) && !x.closest('.ums-master__list') && !x.closest('.ums-master__adv') &&
                    (x.closest('.ums-master__search') || /tìm|từ kho/i.test(x.placeholder || '')); })[0];
            if (!inp) continue;
            coCot = true;
            var ten = (side.querySelector('.ums-panel__title') || {}).textContent || 'cột trái';
            ten = ten.replace(/\s+/g, ' ').trim().slice(0, 30);
            // 1. kính lúp trên tiêu đề
            if (side.querySelector('.ums-panel__head .ums-panel__tools .fa-magnifying-glass'))
                loi.push(ten + ': nút kính lúp trên tiêu đề (phải là Tải lại fa-rotate-right)');
            // 3. nút Tìm kiếm trong cột (không tính kính lúp trang trí trong ô tìm)
            var nutTim = Array.prototype.slice.call(side.querySelectorAll('.ums-panel__body button .fa-magnifying-glass')).filter(function (ic) {
                var b = ic.closest('button'); return !b.classList.contains('ums-searchbar__icon') && !an(b);
            });
            if (nutTim.length) loi.push(ten + ': còn nút Tìm kiếm trong cột (' + nutTim.length + ')');
            // 4. ô chọn lọc hiện sẵn ngoài khung nâng cao
            var selHien = Array.prototype.slice.call(side.querySelectorAll('.ums-panel__body select')).filter(function (s) {
                if (s.closest('.ums-master__list') || s.closest('[hidden]') || s.closest('.ums-master__adv')) return false;
                if (s.closest('.ums-master__foot') || s.closest('.ums-pager') || s.closest('[class*="pager"]')) return false;   // ô số dòng / trang
                return true;
            });
            if (selHien.length) loi.push(ten + ': ' + selHien.length + ' ô chọn lọc hiện sẵn (đưa vào Bộ lọc nâng cao)');
            // 5. mục danh sách KHÔNG mang nút thao tác (sửa / xoá / xem) — thao tác đặt trên tiêu đề khung phải (người dùng 2026-09-26)
            var nutMuc = side.querySelectorAll('.ums-master__list .ums-master__item .fa-pen-to-square, .ums-master__list .ums-master__item .fa-trash-can, .ums-master__list .ums-master__item .fa-eye');
            if (nutMuc.length) loi.push(ten + ': ' + nutMuc.length + ' nút thao tác trong mục danh sách (đưa lên tiêu đề khung phải)');
            // 2. gõ là tự tìm
            var list = side.querySelector('.ums-master__list') || side.querySelector('.ums-panel__body');
            var truoc = list.innerHTML, truocMan = sc.innerHTML, n0 = w.ums.api.call.n || 0;
            inp.value = 'zzqxj'; inp.dispatchEvent(new w.Event('input', { bubbles: true }));
            await wait(900);
            /* lọc tại chỗ có thể đổi cây ở KHUNG PHẢI (vd cơ cấu tổ chức v2) → xét cả màn */
            var doi = list.innerHTML !== truoc || sc.innerHTML !== truocMan || (w.ums.api.call.n || 0) > n0;
            /* danh sách đang TRỐNG (vd cây chỉ có sau khi chọn ứng dụng) thì gõ không đổi gì — không kết luận được */
            var trong = !list.querySelector('.ums-master__item, li, tr');
            if (!doi && !trong) loi.push(ten + ': gõ từ khoá KHÔNG tự tìm (chỉ Enter)');
            inp.value = ''; inp.dispatchEvent(new w.Event('input', { bubbles: true }));
            inp.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
            await wait(300);
        }
        if (!coCot) continue;
        co++;
        if (loi.length) { bad++; log('!! ' + menu[i].ID.replace(TIEN + '-', '') + '\n     - ' + loi.join('\n     - ')); }
        else log('ok ' + menu[i].ID.replace(TIEN + '-', ''));
    }
    log('TONG: ' + (co - bad) + '/' + co + ' man co cot trai dat luat 12');
    log('DONE');
};
</script>
</body></html>
