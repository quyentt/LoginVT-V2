    <script>
        // Bắt lỗi JS sớm nhất có thể và hiển thị ngay trên trang.
        // Code cũ nuốt lỗi khá nhiều (try/catch rỗng), không có cái này thì
        // màn hình trắng mà không biết vì sao.
        window.__harnessErrors = [];
        (function () {
            function render() {
                var box = document.getElementById('harness-errors');
                if (!box || !window.__harnessErrors.length) return;
                box.style.display = 'block';
                box.innerHTML = '<b>LỖI JS (' + window.__harnessErrors.length + ')</b><br>' +
                    window.__harnessErrors.map(function (e) {
                        return '<div class="he-item">' + e + '</div>';
                    }).join('');
            }
            window.__harnessRenderErrors = render;
            window.addEventListener('error', function (e) {
                var at = e.filename ? (' @ ' + e.filename.replace(location.origin, '') + ':' + e.lineno) : '';
                var stack = (e.error && e.error.stack) ? ('<br><small>' + String(e.error.stack).replace(/</g, '&lt;').split('\n').slice(0, 6).join('<br>') + '</small>') : '';
                window.__harnessErrors.push((e.message || 'lỗi không rõ') + at + stack);
                render();
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                window.__harnessErrors.push('Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
                render();
            });
            document.addEventListener('DOMContentLoaded', render);
        })();
    </script>

    <script>
        // Cho phép đổi màn hình và đổi bản Core ngay trên URL:
        //   ?core=Core                       -> nạp Core/  (mặc định Corei/, giống indexi.aspx)
        //   ?app=ApisTaiChinh&page=/Modules/danhmuc/html/danhmucdulieu.html
        (function () {
            var q = {};
            location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
                if (!kv) return;
                var p = kv.split('=');
                q[decodeURIComponent(p[0])] = decodeURIComponent(p.slice(1).join('=') || '');
            });

            var core = q.core === 'Core' ? 'Core' : 'Corei';
            window.HARNESS_CONFIG = {
                module: {
                    appCode: q.app || 'ApisDangKyHoc',
                    url: q.page || '/Modules/kehoachdangkymuabaohiem/html/kehoachmua.html'
                },
                // ?autorun=main_doc.KeHoachMua.getList_KeHoachMua()
                autorun: q.autorun || ''
            };
            document.getElementById('hb-core').textContent = core + '/';
            document.getElementById('hb-page').textContent =
                window.HARNESS_CONFIG.module.appCode + window.HARNESS_CONFIG.module.url;

            ['constant', 'systemroot', 'util', 'systemextend'].forEach(function (f) {
                document.write('<scr' + 'ipt src="' + core + '/' + f + '.js"></scr' + 'ipt>');
            });
        })();

        // Shell thật lấy 30 base URL từ Web.config; harness không gọi mạng nên trả rỗng.
        function Init_API() { return {}; }
    </script>
